[workspace]
resolver = "2"
members = [
    "crates/cs-core",
    "crates/cs-ffmpeg",
    "crates/cs-warmth",
    "crates/cs-dpdf",
    "crates/cs-inworld",
    "crates/cs-whisper",
    "crates/cs-uvr5",
    "crates/compressspeak",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Compress Speak"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
confy = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
which = "7"
tempfile = "3"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rfd = "0.15"
egui = "0.31"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
cs-core = { path = "crates/cs-core" }
cs-ffmpeg = { path = "crates/cs-ffmpeg" }
cs-warmth = { path = "crates/cs-warmth" }
cs-dpdf = { path = "crates/cs-dpdf" }
cs-inworld = { path = "crates/cs-inworld" }
cs-whisper = { path = "crates/cs-whisper" }
cs-uvr5 = { path = "crates/cs-uvr5" }
